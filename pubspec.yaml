name: autoterra
description: B2B платформа для управления спросом через дистрибьюторов, колеровкой и AI-поддержкой автосервисов.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  fl_chart: ^0.67.0
  http: ^1.6.0
  flutter_svg: ^2.2.1
  shared_preferences: ^2.5.3
  image_picker: ^1.2.2
  file_picker: ^8.1.7
  url_launcher: ^6.3.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  http_mock_adapter: ^0.6.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/
  # fonts:
  #   - family: TTOctosquares
  #     fonts:
  #       - asset: assets/fonts/TTOctosquares-Bold.ttf
  #         weight: 700
  #   - family: TTNeoris
  #     fonts:
  #       - asset: assets/fonts/TTNeoris-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/TTNeoris-Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon-1024.png
  remove_alpha_ios: true

